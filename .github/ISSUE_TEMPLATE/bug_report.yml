name: Bug report / 问题反馈
description: Something doesn't work. / 某个功能不正常。
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: Include error messages shown in the page or settings. / 请附上页面或设置页显示的错误信息。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
  - type: dropdown
    id: engine
    attributes:
      label: Translation engine / 翻译引擎
      options:
        - Browser built-in / 浏览器内置
        - Local LLM / 本地大模型
        - OpenAI-compatible / AI 大模型
        - Azure
        - DeepL
        - Google / 谷歌
  - type: input
    id: browser
    attributes:
      label: Browser, version and OS / 浏览器、版本与系统
      placeholder: Edge 158, Windows 11
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU (local LLM only) / 显卡（仅本地大模型）
